name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make lint

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The minimum from go.mod, and the latest release.
        go: ["1.23.x", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Test with the race detector (includes the golden tests)
        run: go test -race -count=1 ./...

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    # Not yet seen passing: kept informational until it has been.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -count=1 ./...

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: scripts/fuzz.sh
        env:
          FUZZTIME: 30s
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"

  bench:
    name: Benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Compare with the base branch
        run: |
          {
            echo "## Benchmarks: ${{ github.base_ref }} vs this PR"
            echo '```'
            scripts/bench-compare.sh "origin/${{ github.base_ref }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Settings match the schema
        run: node scripts/sync-settings.mjs --check
      - name: Package a VSIX
        run: node scripts/package.mjs linux-x64 "ci-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-linux-x64
          path: editors/vscode/vsix/*.vsix

  neovim:
    name: Neovim plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.5
      - run: make nvim-e2e
